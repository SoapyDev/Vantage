[workspace]
members = [
    "crates/cli",
    "crates/mailer",
    "crates/core",
    "crates/runner",
    "crates/reporter",
    "crates/actions",
    "crates/mock-server",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"


[workspace.dependencies]
reqwest = { version = "0.13", features = ["json", "form", "multipart"] }
clap = { version = "4.6", features = ["derive"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "file-transport", "tokio1-rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
